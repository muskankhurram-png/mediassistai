{% extends "base.html" %}
{% block title %}Login — MediAssist AI{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: var(--space-xl) auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: var(--space-md);">Welcome back</h2>

        <form method="post" action="/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-xs);">
                Log In
            </button>
        </form>

        <p style="text-align: center; margin-top: var(--space-md); font-size: 0.9rem;">
            Don't have an account? <a href="/register">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
