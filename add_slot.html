{% extends "base.html" %}

{% block title %}Add Appointment Slot — MediAssist AI{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Add an Appointment Slot</h2>
    <p>Publish a new open time slot for patients to book.</p>
</div>

<div class="card" style="max-width: 480px;">
    <form method="post" action="/doctor/slots/new">
        <div class="form-group">
            <label for="slot_date">Date</label>
            <input type="date" id="slot_date" name="slot_date" required>
        </div>
        <div class="form-group">
            <label for="slot_time">Time</label>
            <input type="time" id="slot_time" name="slot_time" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Slot</button>
    </form>
</div>
{% endblock %}
