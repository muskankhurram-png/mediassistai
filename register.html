{% extends "base.html" %}

{% block title %}Sign Up — MediAssist AI{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: var(--space-xl) auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: var(--space-md);">Create your account</h2>

        <form method="post" action="/register">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters">
            </div>
            <div class="form-group">
                <label for="role">I am a...</label>
                <select id="role" name="role">
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-xs);">
                Create Account
            </button>
        </form>

        <p style="text-align: center; margin-top: var(--space-md); font-size: 0.9rem;">
            Already have an account? <a href="/login">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
